[package]
name = "stego_rust"
version = "0.2.0"
edition = "2021"
authors = ["Fernando Paucar fernandopaucar149@gmail.com"]
description = "Library for image steganography with AES-256-GCM encryption and Argon2id key derivation"
license = "GPL-3.0"
repository = "https://github.com/fernandopr11/StegoRust"
readme = "README.md"
keywords = ["steganography", "cryptography", "image", "aes", "argon2"]
categories = ["cryptography", "encoding", "multimedia::images"]
homepage = "https://github.com/fernandopr11/StegoRust"
documentation = "https://docs.rs/stego_rust"

[dependencies]
image     = "0.25"
sha2      = "0.10"
aes-gcm   = "0.10"
rand      = "0.8"
argon2    = "0.5"
hkdf      = "0.12"
uuid      = { version = "1", features = ["v4"] }
thiserror = "1"
[dev-dependencies]
tempfile = "3"
sha2      = "0.10"
